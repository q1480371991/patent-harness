name: experience-path-guard
# 非维护者的 PR 只允许改动自己的撰写者经验档案（references/cases/experience/<user>.md）。
# 维护者（MAINTAINERS 列表）不受限制。
on:
  pull_request:
    branches: [claude]
jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      MAINTAINERS: "Nafsae"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed paths
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          for m in $MAINTAINERS; do
            if [ "$AUTHOR" = "$m" ]; then echo "maintainer $AUTHOR: skip guard"; exit 0; fi
          done
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}"...HEAD)
          echo "changed files:"; echo "$CHANGED"
          BAD=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              references/cases/experience/*.md)
                base=$(basename "$f" .md)
                if [ "$base" = "README" ]; then echo "DENY: $f (README 仅维护者可改)"; BAD=1; fi
                ;;
              *) echo "DENY: $f (非经验档案路径)"; BAD=1 ;;
            esac
          done <<< "$CHANGED"
          # 额外约束：一个 PR 只能改一个经验档案文件（防止代改他人档案需人工审）
          N=$(echo "$CHANGED" | grep -c '^references/cases/experience/.*\.md$' || true)
          if [ "$N" -gt 1 ]; then echo "DENY: 一次 PR 只允许改动一个经验档案文件"; BAD=1; fi
          exit $BAD
